name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # If you're in a monorepo, add: working-directory: ./apps/web to each run step
      - name: Install deps
        run: npm ci

      - name: Build with OpenNext (produces .open-next/)
        run: npx opennextjs-cloudflare build

      # Option A: deploy using official Wrangler GitHub Action
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # By default runs `wrangler deploy` reading your wrangler.jsonc

          # (Optional) pass secrets into the Worker at deploy time:
          # environment: production
          # secrets: |
          #   DATABASE_URL
          #   NEXTAUTH_SECRET
        env:
          # map from your GitHub repo secrets
          # DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTJS_ENV: production
          NEXT_PUBLIC_UMAMI_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_ID }}
          NEXT_PUBLIC_UMAMI_DOMAINS: ${{ secrets.NEXT_PUBLIC_UMAMI_DOMAINS }}